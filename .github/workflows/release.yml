name: Release

# Changesets によるバージョン採番と npm publish。
#   1. main へ push されると、積まれた changeset から「chore: version packages」PR を自動作成する
#   2. その Version PR をマージすると（= 再度 main へ push）、この job が npm publish する
# insession-app 側の release.yml（タグ + GitHub Release + Railway デプロイ）とは独立。
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm の Trusted Publishing（OIDC）で使う。NPM_TOKEN を使う場合も害はない。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # publish されるのは dist なので、publish 前に必ず作り直す。
      - name: Build dist
        run: pnpm build

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
