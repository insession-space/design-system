name: Release

# Changesets によるバージョン採番と npm publish。
#   1. main へ push されると、積まれた changeset から「chore: version packages」PR を自動作成する
#   2. その Version PR をマージすると（= 再度 main へ push）、この job が npm publish する
# insession-app 側の release.yml（タグ + GitHub Release + Railway デプロイ）とは独立。
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm の Trusted Publishing（OIDC）に必須。これが無いと publish できない。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # publish されるのは dist なので、publish 前に必ず作り直す。
      - name: Build dist
        run: pnpm build

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ⚠ NPM_TOKEN は意図的に渡さない。
        # changesets/action は「env に NPM_TOKEN があればトークン publish、無ければ
        # OIDC（Trusted Publishing）」の順で選ぶため、トークンを渡すと OIDC が使われなくなる。
        # 1.3.1 の初回 publish は OIDC で成功している（トークン無し・2FA プロンプト無し）。
        # OIDC が使えない状況に戻す場合のみ、ここに NPM_TOKEN を足すこと。
