name: CI

# 決定論的な検証チャネル（モデルのトークンを使わずに壊れを検出する）。
#
# ⚠ ここに個別のチェックを列挙しないこと。検査の中身は package.json の `verify` /
# `verify:full` が単一ソースで、この workflow はそれを呼ぶだけにしてある。列挙すると
# 「CI では走るが手元の pnpm verify では走らない」チェックが静かに生まれ、PR 前の確認が
# CI と一致しなくなる（横断ルールが `pnpm verify` を CI と同じチャネルと定めている理由）。
# 検査を足したいときは package.json 側の verify / verify:full に足す。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 全 story への axe は実ブラウザ（Playwright の Chromium）で走る。
      # --with-deps は ubuntu-latest に足りない共有ライブラリを入れるために必要。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # 型検査 / lint / タイポグラフィ / ビルド / 配布 CSS / パッケージ内容 /
      # カタログ網羅 / カタログのビルド / 全 story への axe。中身は package.json を見ること。
      - name: Verify
        run: pnpm verify:full
